<!DOCTYPE html>
<html>
<head>
    <title>News Verifier</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        textarea { width: 95%; height: 100px; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
        .result-section { margin-top: 20px; padding: 15px; background: #e9f7ef; border-radius: 8px; border-left: 5px solid #28a745; }
        .label-style { font-size: 18px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔍 News Verifier</h2>
        <form action="/predict" method="post">
            <textarea name="news" placeholder="Paste news here..." required></textarea>
            <button type="submit">Verify News</button>
        </form>

        {% if rf_res %}
        <div class="result-section">
            <p class="label-style">Verdict: {{ rf_res }}</p>
            <hr>
            <p><strong>AI Analysis:</strong></p>
            <p>{{ ai_res }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
